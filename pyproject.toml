[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion"
version = "0.1.0"
description = "RGB active perception experiments for low-cost robotics"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.24,<2", "opencv-python>=4.8,<4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
viewer = ["rerun-sdk>=0.22,<0.23", "pyarrow>=14,<20"]
analysis = ["matplotlib>=3.9,<4"]

[project.scripts]
occlusion = "occlusion.main:main"
occlusion-viewer = "occlusion.visualizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
